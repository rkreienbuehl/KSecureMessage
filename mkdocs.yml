# Documentation site (docs/releasing.md, "Documentation site"). docs/ is the
# only source; docs/api/ is generated by `./gradlew stageApiReference` (Dokka)
# and git-ignored. The gate is `mkdocs build --strict`: every warning below,
# including broken links, anchors and pages missing from the nav, fails it.
site_name: KSecureMessage
site_url: https://rkreienbuehl.github.io/KSecureMessage/
site_description: Kotlin Multiplatform secure messaging library built on Kodium (X3DH, Double Ratchet)
repo_url: https://github.com/rkreienbuehl/KSecureMessage
repo_name: rkreienbuehl/KSecureMessage
edit_uri: edit/main/docs/
copyright: Copyright 2026 Roger Kreienbühl — Apache License 2.0

docs_dir: docs
strict: true
exclude_docs: |
  requirements.in
  requirements.txt

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Application lifecycle: application-lifecycle.md
  - Security model: security-review.md
  - Identity & verification:
      - Remote identity trust: identity-trust.md
      - Safety numbers and verification: identity-verification.md
  - Sessions & prekeys:
      - Prekey publication: prekey-publication.md
      - Signed prekey lifecycle: signed-prekey-lifecycle.md
      - Session lifecycle: session-lifecycle.md
      - Transport ordering: transport-ordering.md
      - Wire format: wire-format.md
  - Messaging reliability:
      - Message reliability: message-reliability.md
      - Application delivery: application-delivery.md
      - Message discard: message-discard.md
      - Outbound message lifecycle: outbound-message-lifecycle.md
  - Storage & encryption:
      - Client storage: storage.md
      - Storage encryption: storage-encryption.md
      - Storage key providers: storage-key-providers.md
      - Storage key rotation: storage-key-rotation.md
  - Device authentication:
      - Server authentication: server-authentication.md
      - Key rotation and policy: device-authentication-rotation.md
      - Health: device-authentication-health.md
  - Recovery:
      - Device recovery: device-recovery.md
      - Last-device recovery: last-device-recovery.md
      - Recovery key lifecycle: recovery-key-lifecycle.md
      - Recovery key reset: recovery-key-reset.md
  - Server operations:
      - Operating the server: operating-the-server.md
      - Server storage: server-storage.md
  - Platforms:
      - Supported platforms: supported-platforms.md
      - Dependencies: dependencies.md
  - API reference: api-reference.md
  - Release & compatibility:
      - Releasing: releasing.md
      - Project history: project-history.md
  - Security reporting: security-reporting.md
