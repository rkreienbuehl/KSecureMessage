# Tier B: platform and release verification (docs/releasing.md, "CI").
# Apple native tests, the Apple keychain hosts and Android instrumentation.
# Signing material exists only as repository secrets; pull requests from forks
# never receive them, and the signed macOS host then reports NOT EXECUTED.
name: Platform verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apple:
    name: Apple native tests, full klib ABI check, iOS simulator keychain host
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The klib part of the API baseline covers the Apple targets only on a macOS host.
      - name: Apple tests and API check
        run: ./gradlew macosArm64Test iosSimulatorArm64Test :storage:keyprovider:apple:macosArm64Test checkKotlinAbi

      - name: Boot a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in sorted(json.load(sys.stdin)["devices"].items()) if "iOS" in runtime for d in ds]
          iphones = [d for d in devices if d["name"].startswith("iPhone")]
          print(sorted(iphones, key=lambda d: d["name"])[0]["udid"])')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: iOS simulator keychain host
        run: ./gradlew iosSimulatorArm64KeychainHostTest -Pksm.apple.keychainHost.required=true -Pksm.apple.simulator=${{ steps.simulator.outputs.udid }}

  apple-signed-host:
    name: Signed macOS keychain host
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.KSM_APPLE_TEAM_ID != '' && secrets.KSM_APPLE_DEV_CERT_P12_BASE64 != '' && secrets.KSM_APPLE_MACOS_PROFILE_BASE64 != '' }}
    steps:
      - name: Signing material available?
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "KEYCHAIN HOST macOS: NOT EXECUTED — repository secrets KSM_APPLE_TEAM_ID, KSM_APPLE_DEV_CERT_P12_BASE64, KSM_APPLE_DEV_CERT_PASSWORD, KSM_APPLE_MACOS_PROFILE_BASE64 are not available"

      - uses: actions/checkout@v4
        if: env.HAS_SIGNING == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_SIGNING == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_SIGNING == 'true'
        with:
          cache-read-only: true

      # Temporary keychain and profile under $RUNNER_TEMP, removed at the end.
      - name: Install signing identity and profile
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.KSM_APPLE_DEV_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.KSM_APPLE_DEV_CERT_PASSWORD }}
          PROFILE: ${{ secrets.KSM_APPLE_MACOS_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/ksm-signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/ksm.provisionprofile"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # one argument per existing keychain
          security list-keychains -d user -s "$keychain" $existing
          rm "$RUNNER_TEMP/cert.p12"

      # A development profile lists the Macs it may run on; a GitHub-hosted
      # runner is never one of them and macOS kills the host at launch. Such a
      # profile makes this job NOT EXECUTED (a known limitation: the signed
      # macOS host is then a maintainer-machine gate, docs/releasing.md), never
      # passed. Only a profile for all devices (Developer ID) runs here, and
      # then every failure fails the job.
      - name: Profile usable on a hosted runner?
        id: profile
        if: env.HAS_SIGNING == 'true'
        run: |
          security cms -D -i "$RUNNER_TEMP/ksm.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$RUNNER_TEMP/profile.plist" 2>/dev/null)" = "true" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signed macOS keychain host NOT EXECUTED::KSM_APPLE_MACOS_PROFILE_BASE64 is a device-bound development profile and cannot run on GitHub-hosted runners. The signed macOS host is a maintainer-machine release gate (docs/releasing.md)."
            echo "KEYCHAIN HOST macOS: NOT EXECUTED — device-bound development profile, not usable on a hosted runner"
          fi
          rm "$RUNNER_TEMP/profile.plist"

      - name: macOS keychain host
        if: env.HAS_SIGNING == 'true' && steps.profile.outputs.usable == 'true'
        env:
          KSM_APPLE_TEAM_ID: ${{ secrets.KSM_APPLE_TEAM_ID }}
        run: ./gradlew macosArm64KeychainHostTest -Pksm.apple.keychainHost.required=true -Pksm.apple.macosProfile="$RUNNER_TEMP/ksm.provisionprofile"

      - name: Remove signing material
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/ksm-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/ksm.provisionprofile" "$RUNNER_TEMP/cert.p12"

  android:
    name: Android instrumentation (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      # A fixed emulator: API 35, google_apis, x86_64. Never a physical device.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :storage:keyprovider:android:connectedAndroidDeviceTest :storage:client:sqldelight:connectedAndroidDeviceTest
