# Tier A: every push to main and every pull request (docs/releasing.md, "CI").
# Together the jobs cover everything plain `./gradlew build` does on Linux:
# JVM, linuxX64 and server tests, Android host tests, checkKotlinAbi and
# checkReleaseConventions in `build`; the Kotlin/JS Node tests in their own job
# (they take hours, see docs/supported-platforms.md) so both run in parallel.
# `ci-passed` is the single required status.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, linuxX64, API check, publication (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle dependencies, wrapper and Kotlin/Native toolchain; writes only on main.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The linuxX64 test binaries of storage:client:sqldelight link the host's libsqlite3;
      # server:ktor PreS1CleanupTest runs the operator cleanup script with the sqlite3 shell (S1.3).
      - name: Install SQLite development library and shell
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev sqlite3

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Everything of the default build except the Kotlin/JS tests (job js).
      - name: Default build without JS tests
        run: ./gradlew build -x jsNodeTest

      # Fails if any non-JS test task of the Linux matrix (including every
      # linuxX64Test) ran zero tests.
      - name: Supported test matrix executed (non-JS, incl. linuxX64)
        run: ./gradlew verifyTestExecution -Pksm.testMatrix=non-js

      - name: Publication, artifact inspection, consumer fixture
        run: ./gradlew verifyPublication

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  js:
    name: Kotlin/JS Node tests (Linux)
    runs-on: ubuntu-latest
    # Kodium's Ed25519 on Kotlin/JS: client:core jsNodeTest alone takes hours.
    # 360 minutes is the GitHub-hosted maximum.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: JS tests on Node.js
        run: ./gradlew jsNodeTest --continue

      - name: Supported test matrix executed (JS)
        run: ./gradlew verifyTestExecution -Pksm.testMatrix=js

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-js
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  compile-only:
    name: Compile-only targets (Wasm, JS browser, mingwX64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compile main and test code of compile-only targets
        run: ./gradlew verifyCompileOnlyTargets

  ci-passed:
    name: CI passed
    if: always()
    needs: [build, js, compile-only]
    runs-on: ubuntu-latest
    steps:
      - name: All Tier A jobs succeeded
        run: |
          echo 'build=${{ needs.build.result }} js=${{ needs.js.result }} compile-only=${{ needs.compile-only.result }}'
          test '${{ needs.build.result }}' = success
          test '${{ needs.js.result }}' = success
          test '${{ needs.compile-only.result }}' = success
