kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.js.yarn=false
# Dependency downloads: Maven Central answers bursts (CI jobs starting
# together, cold caches) with 429 Too Many Requests. Retry up to 8 times with
# exponential backoff from 1 s (about 2 min in total) instead of Gradle's
# default 3 attempts from 125 ms. Gradle-internal properties.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=1000
